[workspace]
members = [".", "derive"]
default-members = [".", "derive"]

[workspace.package]

edition = "2024"

version = "0.1.3"
keywords = ["scientific", "simulation"]
categories = ["science"]
publish = false

authors = ["Varazdat Stepanyan"]
description = "A kinetic monte carlo engine designed for scientific computing"
readme = "README.md"
repository = "https://github.com/VarazdatStepanyan003/MetroFerris"
license = "GPL-3.0-only"
license-file = "COPYING"

[package]
name = "metroferris"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
publish.workspace = true

[profile.release]
codegen-units = 1
lto = "fat"

[dependencies]
metroferris_derive = {path = "derive"}

[dev-dependencies]
rand = "0.10"
